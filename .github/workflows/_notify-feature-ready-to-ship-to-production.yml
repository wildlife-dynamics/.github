# Dispatches feature notifications to a separate run in .github.
# Project reads, issue comments, and Slack delivery use .github's own secrets.
#
# Inputs:
#   `project_number` (optional, number): Organization project number. Default: 2.
#   `issue_number` (optional, number): Issue for a manual full-flow test.
#   `notification_workflow_ref` (optional, string): Central workflow branch.
# Secrets:
#   `DISPATCH_TOKEN` (required): Token with Actions write access to .github.
#     No project permission is needed by the calling repository.
#
# Example caller:
#
# name: Notify feature owners that Feature is ready to ship
# on:
#   issues:
#     types: [closed]
# permissions: {}
# jobs:
#   notify:
#     uses: wildlife-dynamics/.github/.github/workflows/_notify-feature-ready-to-ship-to-production.yml@main
#     with:
#       project_number: 2
#     secrets:
#       DISPATCH_TOKEN: ${{ secrets.ECOSCOPE_ELEBOT_PAT }}

name: Request feature shipment notification

on:
  workflow_call:
    inputs:
      project_number:
        description: Organization project whose Status must be Done
        required: false
        type: number
        default: 2
      issue_number:
        description: Issue to check when manually testing the full flow
        required: false
        type: number
        default: 0
      notification_workflow_ref:
        description: Branch of the central notification workflow to run
        required: false
        type: string
        default: main
    secrets:
      DISPATCH_TOKEN:
        description: Token with Actions write access to .github
        required: true

permissions: {}

jobs:
  dispatch-feature-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Start notification workflow in .github
        uses: actions/github-script@v9
        env:
          FEATURE_ISSUE_NUMBER: ${{ inputs.issue_number }}
          PROJECT_NUMBER: ${{ inputs.project_number }}
          NOTIFICATION_WORKFLOW_REF: ${{ inputs.notification_workflow_ref }}
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN }}
          script: |
            const manualTest = context.eventName === "workflow_dispatch";
            if (!manualTest && (
              context.eventName !== "issues" ||
              context.payload.action !== "closed" ||
              context.payload.issue?.pull_request
            )) {
              core.info("Ignoring event: not an issue closure.");
              return;
            }

            const issueNumber = manualTest
              ? Number(process.env.FEATURE_ISSUE_NUMBER)
              : context.issue.number;
            const projectNumber = Number(process.env.PROJECT_NUMBER);
            if (
              !Number.isSafeInteger(issueNumber) || issueNumber <= 0 ||
              !Number.isSafeInteger(projectNumber) || projectNumber <= 0
            ) {
              core.setFailed("issue_number and project_number must be positive integers.");
              return;
            }

            const ref = process.env.NOTIFICATION_WORKFLOW_REF || "main";
            const preMergeTest = ref !== "main";
            // Before merge, the registered checks workflow calls the new
            // notification workflow from the same .github branch.
            const { data } = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: ".github",
              workflow_id: preMergeTest
                ? "pull_request_checks.yml"
                : "notify-feature-ready-to-ship-to-production.yml",
              ref,
              inputs: {
                repository: `${context.repo.owner}/${context.repo.repo}`,
                issue_number: String(issueNumber),
                project_number: String(projectNumber),
                fail_if_ineligible: String(manualTest),
                ...(preMergeTest ? { notify_feature: "true" } : {})
              }
            });
            core.info(`Feature notification queued in .github${data?.html_url ? `: ${data.html_url}` : "."}`);
