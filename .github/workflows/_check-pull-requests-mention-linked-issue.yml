# Verifies that a pull request links to an issue in the same repository and that
# the linked issue has a sufficiently detailed description. Pull requests from
# `ecoscope-elebot` and `dependabot` are skipped.
#
# Inputs:
#   `pr_body` (required, string): Pull request body to inspect.
#   `min_issue_description_length` (optional, number): Minimum linked issue
#     description length. Defaults to `30`.
#   `title_ticket_match` (optional, string): Empty by default to retain the
#     existing check. `all` requires every ticket in the title to appear in a
#     recognized description clause; `at_least_one` requires at least one.
#     Both modes require `<tickets>: <plain-language description>`, without a
#     Conventional Commit prefix, including after the ticket numbers.
#     Matching uses the existing clauses, not arbitrary references. Markdown
#     links and references to other repositories remain unrecognized.
#
# Example caller:
#
# name: Check linked issue
#
# on:
#   pull_request:
#     types: [opened, edited, reopened, synchronize]
#
# permissions:
#   issues: read
#
# jobs:
#   check-pull-request-for-linked-issue:
#     uses: wildlife-dynamics/.github/.github/workflows/_check-pull-requests-mention-linked-issue.yml@main
#     with:
#       pr_body: ${{ github.event.pull_request.body }}
#       min_issue_description_length: 30
#       # Optional opt-in: all or at_least_one
#       title_ticket_match: all

name: Check PRs mention a linked issue with a sufficient description

on:
  workflow_call:
    inputs:
      pr_body:
        required: true
        type: string
      min_issue_description_length:
        description: Minimum number of characters required in the linked issue description
        required: false
        type: number
        default: 30
      title_ticket_match:
        description: Match all or at_least_one title tickets to recognized description clauses; empty disables title validation
        required: false
        type: string
        default: ""

jobs:
  check-pull-request-for-linked-issue:
    if: github.event.pull_request.user.login != 'ecoscope-elebot' && github.event.pull_request.user.login != 'dependabot'
    runs-on: ubuntu-latest
    permissions:
      issues: read
    steps:
      - name: Verify Linked Issue has a sufficient description
        uses: actions/github-script@v9
        env:
          pr_body: ${{ inputs.pr_body }}
          min_issue_description_length: ${{ inputs.min_issue_description_length }}
          TITLE_TICKET_MATCH: ${{ inputs.title_ticket_match }}
        with:
          script: |
            const prBody = process.env.pr_body || '';
            const { owner, repo } = context.repo;

            const issuePattern = `(?:closes|closes|closed|fix|fixes|fixed|resolve|resolves|resolved|relates to|related to|towards\)\\s+(?:(?:(?:${owner}\/${repo})?#)|(?:(?:https:\/\/github\.com\/)?${owner}\/${repo}\/issues\/))?(\\d+)`
            const titleTicketMatch = process.env.TITLE_TICKET_MATCH || '';

            if (titleTicketMatch) {
              if (!['all', 'at_least_one'].includes(titleTicketMatch)) {
                core.setFailed('title_ticket_match must be empty, "all" or "at_least_one".');
                return;
              }

              const titleMatch = /^(\d+(?:,\s*\d+)*): (\S.*)$/.exec(context.payload.pull_request.title);
              const conventionalCommitPrefix = /^(?:feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(?:\([^)]*\))?!?:/i;

              if (!titleMatch || conventionalCommitPrefix.test(titleMatch[2])) {
                core.setFailed('Expected: one or more comma-separated ticket numbers, followed by ": " and a plain-language description without a Conventional Commit prefix.');
                return;
              }

              const titleIssues = titleMatch[1].split(/,\s*/);
              const linkedIssues = new Set(
                [...prBody.matchAll(new RegExp(issuePattern, 'gi'))].map(match => match[1])
              );
              const isLinked = number => linkedIssues.has(number);
              const valid = titleTicketMatch === 'all'
                ? titleIssues.every(isLinked)
                : titleIssues.some(isLinked);

              if (!valid) {
                core.setFailed(titleTicketMatch === 'all'
                  ? 'Every title ticket must also be linked in the description.'
                  : 'At least one title ticket must also be linked in the description.');
                return;
              }
            }

            const issuePatternRegexp = new RegExp(issuePattern, 'i');
            const matches = issuePatternRegexp.exec(prBody);

            if (!matches) {
              core.setFailed('No linked issue found in the pull request description.');
              return;
            }

            const issueNumber = parseInt(matches[1], 10);

            try {
              const issue = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber
              });
              const minIssueDescriptionLength = Number(process.env.min_issue_description_length);

              if (!issue.data.body || issue.data.body.trim().length < minIssueDescriptionLength) {
                core.setFailed(`Linked issue #${issueNumber} does not have a sufficient description (at least ${minIssueDescriptionLength} characters required).`);
              } else {
                console.log(`Linked issue #${issueNumber} has a sufficient description.`);
              }
            } catch (error) {
              core.setFailed(`Issue #${issueNumber} not found or inaccessible. Does it exist on the ${owner}/${repo} repository?`);
            }
