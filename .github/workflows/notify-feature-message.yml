# Delivery only: callers supply the text, issue, stable marker, and optional per-message send_to_slack boolean.
# Omitted/true slack keeps GitHub + Slack delivery; false needs no Slack fields or saved thread.
name: Deliver an issue message to GitHub and optionally Slack
run-name: Issue notification for run ${{ inputs.source_run_id }} attempt ${{ inputs.source_run_attempt }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Trusted Compose workflow run containing the prepared messages
        type: string
        required: true
      source_run_attempt:
        description: Run attempt containing the notification artifact
        type: string
        required: true
      notification_phase:
        description: Readiness notification checkpoint; leave empty for existing producers
        type: string
        required: false
        default: ""
      issue_number:
        description: Issue serialization key for a prepared root update
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  # Serialize delivery so two retries cannot send the same unconfirmed message concurrently.
  group: >-
    ${{ inputs.notification_phase == 'issue-title-updated' && format('central-feature-ready-wildlife-dynamics/compose-{0}', inputs.issue_number) || 'central-compose-promotion-notifications' }}
  cancel-in-progress: false
  queue: max

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.ECOSCOPE_ELEBOT_PAT }}
      SLACK_BOT_TOKEN: ${{ secrets.FEATURE_READY_SLACK_BOT_TOKEN }}
      SLACK_MEMBERS: ${{ vars.GH_USERNAME_TO_SLACK_MEMBER_ID }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      NOTIFICATION_PHASE: ${{ inputs.notification_phase }}
      SOURCE_ISSUE_NUMBER: ${{ inputs.issue_number }}
    steps:
      - name: Verify the message artifact and deliver supplied notifications
        shell: bash
        run: |
          # Stop on failed commands, missing variables, and failed pipelines.
          set -Eeuo pipefail
          repo=wildlife-dynamics/compose
          endpoint="repos/$repo"
          # Keep downloaded responses in a temporary directory and remove them on every exit path.
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          # Use one pinned API version for source verification and issue-comment operations.
          api() { gh api -H 'X-GitHub-Api-Version: 2022-11-28' "$@"; }
          fail() { echo "::error::$*" >&2; return 1; }
          # Delivery follows the prepared artifact, while newer run attempts supersede it.
          verify_source_attempt() {
            [[ $(api "$endpoint/actions/runs/$SOURCE_RUN_ID" --jq .run_attempt) == "$SOURCE_RUN_ATTEMPT" ]]
          }
          # Recover the original channel/thread from the feature-ready bot comment's hidden JSON.
          # No record means this issue never had a Slack thread, so its notification is skipped.
          # Multiple records remain an error: guessing between threads could notify the wrong people.
          thread_metadata() {
            jq -c '
              [.[] | select((.user.login == "ecoscope-elebot" or .user.login == "github-actions[bot]") and
                (.body | startswith("<!-- feature-ready-to-ship-to-production -->"))) |
                .body | scan("<!-- feature-slack-thread:v1\\s*([\\s\\S]*?)\\s*-->") | .[0] | fromjson] |
              if length == 0 then null
              elif length == 1 then .[0]
              else error("Expected at most one trusted issue Slack thread") end |
              if . == null then .
              elif (.channel_id | type == "string" and test("^[CG][A-Z0-9]+$")) and
                 (.thread_ts | type == "string" and test("^[0-9]+\\.[0-9]+$"))
              then {channel_id,thread_ts} else error("Invalid saved Slack thread") end'
          }
          # Compose supplies GitHub logins; only this repository holds the Slack member-ID mapping.
          # Match logins case-insensitively and silently skip users without a Slack mapping.
          slack_mentions() {
            jq -er --argjson users "$1" '
              if type != "object" then error("Expected GitHub-to-Slack map") else
                with_entries(.key |= ascii_downcase) as $members |
                [$users[] | ascii_downcase | . as $login |
                  $members[$login] | select(. != null) |
                  if type == "string" and test("^[UW][A-Z0-9]+$") then "<@" + . + ">"
                  else error("Invalid Slack member ID") end] | unique | join(" ") end'
          }
          # Prepared root updates keep their exact comment tail and destination as write preconditions.
          # Titles/wording/recipients are selected by the producer, never reconstructed here.
          update_thread() {
            jq -ce '
              if (split("<!-- feature-slack-thread:") | length) != 2 or
                (split("<!-- feature-ready-slack-sent -->") | length) != 2 or
                contains("<!-- feature-ready-slack-pending -->") then error("Ambiguous saved thread") else . end |
              [scan("<!-- feature-slack-thread:v1\\s*([\\s\\S]*?)\\s*-->") | .[0] | fromjson] |
              if length == 1 and (.[0] | type == "object" and length == 2 and
                (.channel_id | type == "string" and test("^[CG][A-Z0-9]+$")) and
                (.thread_ts | type == "string" and test("^[0-9]+\\.[0-9]+$")))
              then .[0] else error("Invalid saved update thread") end'
          }
          update_preconditions() {
            printf '%s' "$1" | jq -e --argjson message "$notification" --arg endpoint "https://api.github.com/$endpoint" '
              (.user.login | IN("ecoscope-elebot", "github-actions[bot]")) and
              (.id | tostring) == $message.comment_id and
              .issue_url == ($endpoint + "/issues/" + $message.issue_number) and
              .html_url == ("https://github.com/wildlife-dynamics/compose/issues/" + $message.issue_number + "#issuecomment-" + $message.comment_id) and
              (.body | startswith($message.marker + "\n") and endswith($message.expected_github_suffix))' >/dev/null
          }
          check_update_source() {
            local issue
            # Read outside a conditional: API/JSON failures fail delivery, only equality false skips it.
            issue=$(api "$endpoint/issues/$number")
            source_matches=$(printf '%s' "$issue" | jq -r --arg number "$number" --argjson fields "$fields" '
              if type != "object" or (.number | tostring) != $number or .pull_request != null
              then error("Invalid source issue") else . as $issue |
                ($fields | to_entries | all(.[]; $issue[.key] == .value)) end')
            [[ "$source_matches" == true || "$source_matches" == false ]]
          }
          deliver_update() {
            local notification number fields source_matches metadata comment comments id path mentions heading url payload status current
            notification=$(jq -c '.notifications[0]' "$work/messages.json")
            number=$(printf '%s' "$notification" | jq -r .issue_number)
            fields=$(printf '%s' "$notification" | jq -c .source_fields)
            # Equality is only a freshness guard; stale prepared content must never undo a newer edit.
            check_update_source
            if [[ "$source_matches" == false ]]; then
              echo 'Prepared source fields are stale; skipping both updates.'
              return 0
            fi
            metadata=$(printf '%s' "$notification" | jq '.expected_github_suffix' | update_thread)
            printf '%s' "$notification" | jq -e --argjson saved "$metadata" '.metadata == $saved' >/dev/null
            id=$(printf '%s' "$notification" | jq -r .comment_id)
            path="$endpoint/issues/comments/$id"
            comments=$(api --paginate --slurp "$endpoint/issues/$number/comments?per_page=100" | jq add)
            printf '%s' "$comments" | jq -e --argjson message "$notification" '
              [.[] | select((.user.login | IN("ecoscope-elebot", "github-actions[bot]")) and
                (.body | startswith($message.marker + "\n")))] |
              length == 1 and (.[0].id | tostring) == $message.comment_id' >/dev/null
            comment=$(api "$path")
            update_preconditions "$comment"
            # Keep the supplied recipient order; append deliveries retain their existing deduplication.
            mentions=$(printf '%s' "$SLACK_MEMBERS" | jq -er --argjson users "$(printf '%s' "$notification" | jq -c .slack_users)" '
              if type != "object" then error("Expected Slack member map") else
                with_entries(.key |= ascii_downcase) as $members |
                [$users[] | ascii_downcase | $members[.] |
                  if type == "string" and test("^[UW][A-Z0-9]+$") then "<@" + . + ">"
                  else error("Missing or invalid original recipient mapping") end] | join(" ") end')
            [[ -n "$SLACK_BOT_TOKEN" ]]
            heading=$(printf '%s' "$notification" | jq -r .slack_heading)
            url=$(printf '%s' "$comment" | jq -r .html_url)
            payload=$(printf '%s' "$notification" | jq --arg mentions "$mentions" --arg url "$url" '
              (.slack_heading + "\n\n" + $mentions + " " + .slack_text) as $text |
              {channel:.metadata.channel_id,ts:.metadata.thread_ts,text:($text + "\n" + $url),
               blocks:[{type:"section",text:{type:"mrkdwn",text:$text,verbatim:true}},
                 {type:"context",elements:[{type:"mrkdwn",text:("<"+$url+"|View GitHub comment>")}]}]}')
            verify_source_attempt
            check_update_source
            if [[ "$source_matches" == false ]]; then echo 'Prepared source fields changed; skipping both updates.'; return 0; fi
            status=$(curl --silent --show-error --max-time 30 --output "$work/slack" --write-out '%{http_code}' \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H 'Content-Type: application/json' \
              --data-binary "$payload" https://slack.com/api/chat.update)
            [[ "$status" == 200 ]]
            # Slack can normalize fallback text; validate the supplied displayed heading and root identity.
            jq -e --argjson saved "$metadata" --arg heading "$heading" '
              .ok == true and .channel == $saved.channel_id and .ts == $saved.thread_ts and
              (([.message.blocks[]? | select(.type == "section") | .text.text][0] // .message.text // .text) |
                split("\n")[0]) == $heading' "$work/slack" >/dev/null
            verify_source_attempt
            check_update_source
            if [[ "$source_matches" == false ]]; then echo 'Prepared source fields changed after Slack update; skipping GitHub update.'; return 0; fi
            current=$(api "$path")
            update_preconditions "$current"
            # Reruns still update Slack even if GitHub already holds the target body.
            if ! printf '%s' "$current" | jq -e --argjson message "$notification" '.body == $message.github_body' >/dev/null; then
              printf '%s' "$notification" | jq '{body:.github_body}' | api --method PATCH "$path" --input - --silent
            fi
          }
          deliver() {
            local notification number marker github_text send_to_slack slack_text slack_users issue comments comment mentions
            local metadata id path payload status current state reply feature_failed failures=0 threaded=0 slack_requested=0
            # Read each prepared notification as JSON data. No message text is evaluated as shell code.
            # A failed delivery should not prevent attempts for other issues; fail the run afterward.
            while IFS= read -r notification; do
              verify_source_attempt || return 1
              number=$(printf '%s' "$notification" | jq -er .issue_number)
              marker=$(printf '%s' "$notification" | jq -er .marker)
              github_text=$(printf '%s' "$notification" | jq -er .github_text)
              send_to_slack=$(printf '%s' "$notification" | jq -r 'if has("send_to_slack") then .send_to_slack else true end')
              if [[ "$send_to_slack" == true ]]; then slack_requested=$((slack_requested + 1)); fi
              feature_failed=false
              # The caller selects the issue and people; never turn a PR into an issue-comment target.
              issue=$(api "$endpoint/issues/$number") || { failures=1; continue; }
              printf '%s' "$issue" | jq -e '.pull_request == null' >/dev/null || { failures=1; continue; }
              # Retain legacy delivery markers so confirmed messages remain deduplicated after upgrades.
              comments=$(api --paginate --slurp "$endpoint/issues/$number/comments?per_page=100" | jq add) || { failures=1; continue; }
              # The caller's stable marker identifies this notification across workflow retries.
              # Accept only our bot's matching comment, and reject ambiguous duplicate matches.
              comment=$(printf '%s' "$comments" | jq -c --arg marker "$marker" '
                [.[] | select(.user.login == "ecoscope-elebot" and (.body | startswith($marker)))] |
                if length > 1 then error("Duplicate notification comments") else .[0] end') || { failures=1; continue; }
              # GitHub-only messages do not depend on Slack threads, receipts, recipients, or credentials.
              # Reuse the exact bot comment on retries, even if it already contains Slack receipt markers.
              if [[ "$send_to_slack" == false ]]; then
                if [[ "$comment" == null ]]; then
                  verify_source_attempt || return 1
                  payload=$(jq -n --arg body "$marker"$'\n'"$github_text" '{body:$body}')
                  printf '%s' "$payload" | api --method POST "$endpoint/issues/$number/comments" --input - >/dev/null || { failures=1; continue; }
                fi
                continue
              fi
              slack_text=$(printf '%s' "$notification" | jq -er .slack_text)
              slack_users=$(printf '%s' "$notification" | jq -ce .slack_users)
              # A confirmed Slack receipt means the entire notification is already delivered.
              if [[ "$comment" != null ]] &&
                 printf '%s' "$comment" | jq -e '.body | contains("<!-- promotion-slack-sent:")' >/dev/null; then
                threaded=$((threaded + 1))
                continue
              fi
              # Pending means an earlier send may have succeeded before its receipt could be recorded.
              # Stop rather than automatically sending a second ping; a human must verify that case.
              if [[ "$comment" != null ]] &&
                 printf '%s' "$comment" | jq -e '.body | contains("<!-- promotion-slack-pending -->")' >/dev/null; then
                fail "Issue #$number has ambiguous Slack delivery; verify manually before clearing its pending marker." || true
                failures=1
                continue
              fi
              # Always reuse the saved thread, even if the configured channel for new issues changes.
              metadata=$(printf '%s' "$comments" | thread_metadata) || feature_failed=true
              if [[ "$feature_failed" == false && "$metadata" == null ]]; then
                echo "Issue #$number has no saved Slack thread; skipping its GitHub and Slack notification."
                continue
              fi
              if [[ "$feature_failed" == false ]]; then threaded=$((threaded + 1)); fi
              mentions=$(printf '%s' "$SLACK_MEMBERS" | slack_mentions "$slack_users") || feature_failed=true
              if [[ "$feature_failed" == true || -z "$SLACK_BOT_TOKEN" ]]; then
                fail "Issue #$number needs valid saved thread metadata, Slack mapping, and bot credentials." || true
                failures=1
                continue
              fi
              if [[ "$comment" == null ]]; then
                verify_source_attempt || return 1
                # Post the supplied GitHub wording once; later attempts reuse this same comment.
                payload=$(jq -n --arg body "$marker"$'\n'"$github_text" '{body:$body}')
                comment=$(printf '%s' "$payload" | api --method POST "$endpoint/issues/$number/comments" --input -) || { failures=1; continue; }
              fi
              id=$(printf '%s' "$comment" | jq -er .id)
              path="$endpoint/issues/comments/$id"
              verify_source_attempt || return 1
              # Record intent before sending: a timeout cannot prove whether Slack accepted the message.
              printf '%s' "$comment" | jq '{body:(.body + "\n<!-- promotion-slack-pending -->")}' |
                api --method PATCH "$path" --input - --silent || { failures=1; continue; }
              # Compose already supplied Slack mrkdwn; prepend explicit member mentions without rewriting it.
              # Supplying thread_ts replies in the original thread instead of creating a new root message.
              payload=$(printf '%s' "$metadata" | jq --arg text "$mentions $slack_text" '
                {channel:.channel_id,thread_ts:.thread_ts,text:$text,unfurl_links:false,unfurl_media:false,
                 blocks:[{type:"section",text:{type:"mrkdwn",text:$text,verbatim:true}}]}')
              verify_source_attempt || return 1
              if ! status=$(curl --silent --show-error --max-time 30 --output "$work/slack" --write-out '%{http_code}' \
                -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H 'Content-Type: application/json' \
                --data-binary "$payload" https://slack.com/api/chat.postMessage); then
                # Preserve pending when the network result is uncertain; retrying could duplicate delivery.
                fail "Issue #$number Slack delivery is ambiguous; verify before retrying." || true
                failures=1
                continue
              fi
              if [[ "$status" != 200 ]] || ! jq -e '.ok == true' "$work/slack" >/dev/null; then
                # A definite rejection can be retried after fixing permissions/token/channel access.
                # Leave pending in place for ambiguous server failures where Slack may have accepted it.
                if [[ "$status" =~ ^4[0-9][0-9]$ ]] || { [[ "$status" == 200 ]] && jq -e '.ok == false' "$work/slack" >/dev/null; }; then
                  current=$(api "$path") || { failures=1; continue; }
                  printf '%s' "$current" | jq '{body:(.body | split("\n<!-- promotion-slack-pending -->") | join(""))}' |
                    api --method PATCH "$path" --input - --silent || true
                fi
                jq -c '{error,needed,provided}' "$work/slack" >&2 || true
                fail "Issue #$number Slack request failed (HTTP $status). Inspect its delivery marker before retrying." || true
                failures=1
                continue
              fi
              # Confirm the returned channel and thread match the saved destination before trusting the receipt.
              reply=$(jq -ce --argjson saved "$metadata" '
                if .channel == $saved.channel_id and .message.thread_ts == $saved.thread_ts and
                  (.ts | type == "string" and test("^[0-9]+\\.[0-9]+$"))
                then {channel_id:.channel,thread_ts:$saved.thread_ts,reply_ts:.ts}
                else error("Invalid Slack reply identity") end' "$work/slack") || { failures=1; continue; }
              # Append actual Slack IDs to caller metadata. They stay hidden inside the GitHub HTML comment.
              state=$(printf '%s' "$notification" | jq -c --argjson reply "$reply" '.metadata + $reply')
              # Re-read before patching so unrelated edits to the visible comment are retained.
              current=$(api "$path") || { failures=1; continue; }
              verify_source_attempt || return 1
              printf '%s' "$current" | jq --arg state "$state" '
                {body:((.body | split("\n<!-- promotion-slack-pending -->") | join("")) + "\n<!-- promotion-slack-sent:" + $state + " -->")}' |
                api --method PATCH "$path" --input - --silent || { failures=1; continue; }
            done < <(jq -c '.notifications[]' "$work/messages.json")
            if [[ "$slack_requested" -gt 0 && "$threaded" == 0 ]]; then
              fail 'None of the linked tickets has a saved Slack thread.' || true
              return 1
            fi
            return "$failures"
          }

          # This workflow owns the credentials, so reject runs outside the trusted repository/main entry point.
          [[ "$GITHUB_REPOSITORY" == wildlife-dynamics/.github && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ && "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ $(api user --jq '.login | ascii_downcase') == ecoscope-elebot ]]

          # Trust only explicit Compose producers, independently of their release policy.
          for ((wait_count=0; wait_count<30; wait_count++)); do
            source_run=$(api "$endpoint/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_RUN_ATTEMPT")
            status=$(printf '%s' "$source_run" | jq -er .status)
            [[ "$status" == in_progress || "$status" == completed ]] && break
            sleep 10
          done
          printf '%s' "$source_run" | jq -e --arg repo "$repo" --arg phase "$NOTIFICATION_PHASE" --argjson attempt "$SOURCE_RUN_ATTEMPT" '
            .repository.full_name == $repo and .head_repository.full_name == $repo and
            .run_attempt == $attempt and
            (if .path == ".github/workflows/sync-issue-title-with-already-sent-notifications.yml" then
              .event == "issues" and .head_branch == "main" and $phase == "issue-title-updated"
            else $phase != "issue-title-updated" and (.path | IN(
              ".github/workflows/production-pr-readiness.yml",
              ".github/workflows/stage-pr-readiness.yml",
              ".github/workflows/stopgap-stage-preview-deploy.yml",
              ".github/workflows/stage-preview-deploy.yml",
              ".github/workflows/stage.yaml",
              ".github/workflows/prod.yaml",
              ".github/workflows/promote-stage-to-prod.yml")) and
            (.event | IN("pull_request", "pull_request_target", "workflow_dispatch")) end) and
            (.status == "in_progress" or (.status == "completed" and
              (.conclusion | IN("success", "failure", "cancelled"))))' >/dev/null
          verify_source_attempt
          head_sha=$(printf '%s' "$source_run" | jq -er .head_sha)
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          artifact_name="feature-notifications-$SOURCE_RUN_ATTEMPT"
          upload_step='Save feature notifications'
          if [[ -n "$NOTIFICATION_PHASE" ]]; then
            [[ "$NOTIFICATION_PHASE" =~ ^[a-z][a-z0-9-]{0,63}$ ]]
            artifact_name+="-$NOTIFICATION_PHASE"
            upload_step+=" ($NOTIFICATION_PHASE)"
          fi
          # Require the upload to have completed even when the caller is reporting its own failure.
          api --paginate --slurp "$endpoint/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_RUN_ATTEMPT/jobs?per_page=100" |
            jq -e --arg step "$upload_step" \
              'any(.[].jobs[]; any(.steps[]; .name == $step and .conclusion == "success"))' >/dev/null
          # Bind one nonexpired, size-limited artifact to this exact run, attempt, and workflow revision.
          artifact=$(api --paginate --slurp "$endpoint/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" |
            jq -ce --arg name "$artifact_name" --argjson run "$SOURCE_RUN_ID" --arg sha "$head_sha" '
              [.[].artifacts[] | select(.name == $name)] |
              if length == 1 then .[0] else error("Expected exactly one notification artifact") end |
              select(.expired == false and .workflow_run.id == $run and .workflow_run.head_sha == $sha and
                (.id|type == "number" and . > 0) and .size_in_bytes > 0 and .size_in_bytes <= 1048576)')
          artifact_id=$(printf '%s' "$artifact" | jq -er .id)
          api "$endpoint/actions/artifacts/$artifact_id/zip" > "$work/messages.zip"
          # Read only the expected JSON member. Never extract paths or execute artifact-supplied content.
          unzip -p "$work/messages.zip" feature-notifications.json > "$work/messages.json"
          # Validate the delivery envelope before making any writes: repository/run identity, issue numbers,
          # unique delivery keys, bounded message sizes, valid recipient logins, and safe hidden metadata.
          # Release outcomes and wording are deliberately not interpreted here; Compose owns that policy.
          jq -e --arg repo "$repo" --arg run "$SOURCE_RUN_ID" --arg attempt "$SOURCE_RUN_ATTEMPT" '
            .version == 1 and .repository == $repo and .source_run_id == $run and .source_run_attempt == $attempt and
            (.notifications | type == "array" and length > 0 and length <= 50 and
              (unique_by([.issue_number,.marker]) | length) == length and all(.[];
                if .operation == "update" then
                  (.issue_number | type == "string" and test("^[1-9][0-9]*$")) and
                  (.comment_id | type == "string" and test("^[1-9][0-9]*$")) and
                  .marker == "<!-- feature-ready-to-ship-to-production -->" and
                  (.source_fields | type == "object" and length > 0 and (tojson | length <= 5000)) and
                  (.expected_github_suffix | type == "string" and startswith("\n\n") and length > 2 and length <= 60000) and
                  (. as $message | .github_body | type == "string" and length <= 60000 and
                    startswith($message.marker + "\n") and endswith($message.expected_github_suffix)) and
                  (.slack_heading | type == "string" and length > 0 and length <= 1000 and (contains("\n") | not)) and
                  (.slack_text | type == "string" and length > 0 and length <= 2500) and
                  (.slack_users | type == "array" and length > 0 and length <= 25 and all(.[];
                    type == "string" and test("^[A-Za-z0-9][A-Za-z0-9-]{0,38}$"))) and
                  (.metadata | type == "object" and length == 2 and
                    (.channel_id | type == "string" and test("^[CG][A-Z0-9]+$")) and
                    (.thread_ts | type == "string" and test("^[0-9]+\\.[0-9]+$"))) and
                  (has("send_to_slack") | not)
                else
                (.send_to_slack == false) as $github_only |
                ((has("operation") | not) or .operation == "append") and
                (.issue_number | type == "string" and test("^[1-9][0-9]*$")) and
                (.marker | type == "string" and test("^<!-- [A-Za-z0-9][A-Za-z0-9 _:=.-]{0,500} -->$")) and
                (.github_text | type == "string" and length > 0 and length <= 60000 and (contains("<!--") | not)) and
                ((has("send_to_slack") | not) or (.send_to_slack | type == "boolean")) and
                ((.send_to_slack == false and (has("slack_text") | not)) or
                  (.slack_text | type == "string" and (length > 0 or $github_only) and length <= 2500)) and
                ((.send_to_slack == false and (has("slack_users") | not)) or
                  (.slack_users | type == "array" and (length > 0 or $github_only) and length <= 25 and all(.[];
                    type == "string" and test("^[A-Za-z0-9][A-Za-z0-9-]{0,38}$")))) and
                (.metadata | type == "object" and (tojson | length <= 5000 and (contains("-->") | not))) end))' \
            "$work/messages.json" >/dev/null
          if [[ -n "$NOTIFICATION_PHASE" ]]; then
            jq -e --arg phase "$NOTIFICATION_PHASE" '.outcome == $phase' "$work/messages.json" >/dev/null
          fi
          if [[ "$NOTIFICATION_PHASE" == issue-title-updated ]]; then
            [[ "$SOURCE_ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
            jq -e --arg number "$SOURCE_ISSUE_NUMBER" '
              .notifications | length == 1 and all(.[]; .operation == "update" and .issue_number == $number)' "$work/messages.json" >/dev/null
          else
            jq -e '.notifications | all(.[]; .operation != "update")' "$work/messages.json" >/dev/null
          fi
          # Recheck the source attempt immediately before delivery.
          verify_source_attempt
          # Only verified caller-supplied messages reach GitHub and Slack. Delivery markers handle retries.
          if [[ "$NOTIFICATION_PHASE" == issue-title-updated ]]; then deliver_update; else deliver; fi
          echo 'Supplied notifications processed.'
