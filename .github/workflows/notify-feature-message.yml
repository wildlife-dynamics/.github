# Delivery only: callers supply the complete text, recipients, issue, and stable delivery marker.
name: Deliver a Feature or Bug message to GitHub and Slack
run-name: Issue notification for run ${{ inputs.source_run_id }} attempt ${{ inputs.source_run_attempt }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Trusted Compose workflow run containing the prepared messages
        type: string
        required: true
      source_run_attempt:
        description: Run attempt containing the notification artifact
        type: string
        required: true

permissions: {}

concurrency:
  # Serialize delivery so two retries cannot send the same unconfirmed message concurrently.
  group: central-compose-promotion-notifications
  cancel-in-progress: false
  queue: max

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.ECOSCOPE_ELEBOT_PAT }}
      SLACK_BOT_TOKEN: ${{ secrets.FEATURE_READY_SLACK_BOT_TOKEN }}
      SLACK_MEMBERS: ${{ vars.GH_USERNAME_TO_SLACK_MEMBER_ID }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
    steps:
      - name: Verify the message artifact and deliver supplied notifications
        shell: bash
        run: |
          # Stop on failed commands, missing variables, and failed pipelines.
          set -Eeuo pipefail
          repo=wildlife-dynamics/compose
          endpoint="repos/$repo"
          # Keep downloaded responses in a temporary directory and remove them on every exit path.
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          # Use one pinned API version for source verification and issue-comment operations.
          api() { gh api -H 'X-GitHub-Api-Version: 2022-11-28' "$@"; }
          fail() { echo "::error::$*" >&2; return 1; }
          # Recover the original channel/thread from the feature-ready bot comment's hidden JSON.
          # No record means this issue never had a Slack thread, so its notification is skipped.
          # Multiple records remain an error: guessing between threads could notify the wrong people.
          thread_metadata() {
            jq -c '
              [.[] | select((.user.login == "ecoscope-elebot" or .user.login == "github-actions[bot]") and
                (.body | startswith("<!-- feature-ready-to-ship-to-production -->"))) |
                .body | scan("<!-- feature-slack-thread:v1\\s*([\\s\\S]*?)\\s*-->") | .[0] | fromjson] |
              if length == 0 then null
              elif length == 1 then .[0]
              else error("Expected at most one trusted issue Slack thread") end |
              if . == null then .
              elif (.channel_id | type == "string" and test("^[CG][A-Z0-9]+$")) and
                 (.thread_ts | type == "string" and test("^[0-9]+\\.[0-9]+$"))
              then {channel_id,thread_ts} else error("Invalid saved Slack thread") end'
          }
          # Compose supplies GitHub logins; only this repository holds the Slack member-ID mapping.
          # Match logins case-insensitively and silently skip users without a Slack mapping.
          slack_mentions() {
            jq -er --argjson users "$1" '
              if type != "object" then error("Expected GitHub-to-Slack map") else
                with_entries(.key |= ascii_downcase) as $members |
                [$users[] | ascii_downcase | . as $login |
                  $members[$login] | select(. != null) |
                  if type == "string" and test("^[UW][A-Z0-9]+$") then "<@" + . + ">"
                  else error("Invalid Slack member ID") end] | unique | join(" ") end'
          }
          deliver() {
            local notification number marker github_text slack_text slack_users issue comments comment mentions
            local metadata id path payload status current state reply feature_failed failures=0
            # Read each prepared notification as JSON data. No message text is evaluated as shell code.
            # A failed delivery should not prevent attempts for other issues; fail the run afterward.
            while IFS= read -r notification; do
              number=$(printf '%s' "$notification" | jq -er .issue_number)
              marker=$(printf '%s' "$notification" | jq -er .marker)
              github_text=$(printf '%s' "$notification" | jq -er .github_text)
              slack_text=$(printf '%s' "$notification" | jq -er .slack_text)
              slack_users=$(printf '%s' "$notification" | jq -ce .slack_users)
              feature_failed=false
              # The caller selects the issue and people; never turn a PR into an issue-comment target.
              issue=$(api "$endpoint/issues/$number") || { failures=1; continue; }
              printf '%s' "$issue" | jq -e '.pull_request == null' >/dev/null || { failures=1; continue; }
              # Retain legacy delivery markers so confirmed messages remain deduplicated after upgrades.
              comments=$(api --paginate --slurp "$endpoint/issues/$number/comments?per_page=100" | jq add) || { failures=1; continue; }
              # The caller's stable marker identifies this notification across workflow retries.
              # Accept only our bot's matching comment, and reject ambiguous duplicate matches.
              comment=$(printf '%s' "$comments" | jq -c --arg marker "$marker" '
                [.[] | select(.user.login == "ecoscope-elebot" and (.body | startswith($marker)))] |
                if length > 1 then error("Duplicate notification comments") else .[0] end') || { failures=1; continue; }
              # A confirmed Slack receipt means the entire notification is already delivered.
              if [[ "$comment" != null ]] &&
                 printf '%s' "$comment" | jq -e '.body | contains("<!-- promotion-slack-sent:")' >/dev/null; then
                continue
              fi
              # Pending means an earlier send may have succeeded before its receipt could be recorded.
              # Stop rather than automatically sending a second ping; a human must verify that case.
              if [[ "$comment" != null ]] &&
                 printf '%s' "$comment" | jq -e '.body | contains("<!-- promotion-slack-pending -->")' >/dev/null; then
                fail "Issue #$number has ambiguous Slack delivery; verify manually before clearing its pending marker." || true
                failures=1
                continue
              fi
              # Always reuse the saved thread, even if the configured channel for new issues changes.
              metadata=$(printf '%s' "$comments" | thread_metadata) || feature_failed=true
              if [[ "$feature_failed" == false && "$metadata" == null ]]; then
                echo "Issue #$number has no saved Slack thread; skipping its GitHub and Slack notification."
                continue
              fi
              mentions=$(printf '%s' "$SLACK_MEMBERS" | slack_mentions "$slack_users") || feature_failed=true
              if [[ "$feature_failed" == true || -z "$SLACK_BOT_TOKEN" ]]; then
                fail "Issue #$number needs valid saved thread metadata, Slack mapping, and bot credentials." || true
                failures=1
                continue
              fi
              if [[ "$comment" == null ]]; then
                # Post the supplied GitHub wording once; later attempts reuse this same comment.
                payload=$(jq -n --arg body "$marker"$'\n'"$github_text" '{body:$body}')
                comment=$(printf '%s' "$payload" | api --method POST "$endpoint/issues/$number/comments" --input -) || { failures=1; continue; }
              fi
              id=$(printf '%s' "$comment" | jq -er .id)
              path="$endpoint/issues/comments/$id"
              # Record intent before sending: a timeout cannot prove whether Slack accepted the message.
              printf '%s' "$comment" | jq '{body:(.body + "\n<!-- promotion-slack-pending -->")}' |
                api --method PATCH "$path" --input - --silent || { failures=1; continue; }
              # Compose already supplied Slack mrkdwn; prepend explicit member mentions without rewriting it.
              # Supplying thread_ts replies in the original thread instead of creating a new root message.
              payload=$(printf '%s' "$metadata" | jq --arg text "$mentions $slack_text" '
                {channel:.channel_id,thread_ts:.thread_ts,text:$text,unfurl_links:false,unfurl_media:false,
                 blocks:[{type:"section",text:{type:"mrkdwn",text:$text,verbatim:true}}]}')
              if ! status=$(curl --silent --show-error --max-time 30 --output "$work/slack" --write-out '%{http_code}' \
                -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H 'Content-Type: application/json' \
                --data-binary "$payload" https://slack.com/api/chat.postMessage); then
                # Preserve pending when the network result is uncertain; retrying could duplicate delivery.
                fail "Issue #$number Slack delivery is ambiguous; verify before retrying." || true
                failures=1
                continue
              fi
              if [[ "$status" != 200 ]] || ! jq -e '.ok == true' "$work/slack" >/dev/null; then
                # A definite rejection can be retried after fixing permissions/token/channel access.
                # Leave pending in place for ambiguous server failures where Slack may have accepted it.
                if [[ "$status" =~ ^4[0-9][0-9]$ ]] || { [[ "$status" == 200 ]] && jq -e '.ok == false' "$work/slack" >/dev/null; }; then
                  current=$(api "$path") || { failures=1; continue; }
                  printf '%s' "$current" | jq '{body:(.body | split("\n<!-- promotion-slack-pending -->") | join(""))}' |
                    api --method PATCH "$path" --input - --silent || true
                fi
                jq -c '{error,needed,provided}' "$work/slack" >&2 || true
                fail "Issue #$number Slack request failed (HTTP $status). Inspect its delivery marker before retrying." || true
                failures=1
                continue
              fi
              # Confirm the returned channel and thread match the saved destination before trusting the receipt.
              reply=$(jq -ce --argjson saved "$metadata" '
                if .channel == $saved.channel_id and .message.thread_ts == $saved.thread_ts and
                  (.ts | type == "string" and test("^[0-9]+\\.[0-9]+$"))
                then {channel_id:.channel,thread_ts:$saved.thread_ts,reply_ts:.ts}
                else error("Invalid Slack reply identity") end' "$work/slack") || { failures=1; continue; }
              # Append actual Slack IDs to caller metadata. They stay hidden inside the GitHub HTML comment.
              state=$(printf '%s' "$notification" | jq -c --argjson reply "$reply" '.metadata + $reply')
              # Re-read before patching so unrelated edits to the visible comment are retained.
              current=$(api "$path") || { failures=1; continue; }
              printf '%s' "$current" | jq --arg state "$state" '
                {body:((.body | split("\n<!-- promotion-slack-pending -->") | join("")) + "\n<!-- promotion-slack-sent:" + $state + " -->")}' |
                api --method PATCH "$path" --input - --silent || { failures=1; continue; }
            done < <(jq -c '.notifications[]' "$work/messages.json")
            return "$failures"
          }

          # This workflow owns the credentials, so reject runs outside the trusted repository/main entry point.
          [[ "$GITHUB_REPOSITORY" == wildlife-dynamics/.github && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ && "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ $(api user --jq '.login | ascii_downcase') == ecoscope-elebot ]]

          # Accept the current attempt of an allowlisted Compose entry point.
          # Wait for the producer to finish uploading before consuming its artifact.
          for ((wait_count=0; wait_count<30; wait_count++)); do
            source_run=$(api "$endpoint/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_RUN_ATTEMPT")
            [[ $(printf '%s' "$source_run" | jq -r .status) == completed ]] && break
            sleep 10
          done
          printf '%s' "$source_run" | jq -e --arg repo "$repo" --argjson attempt "$SOURCE_RUN_ATTEMPT" '
            .repository.full_name == $repo and .run_attempt == $attempt and .status == "completed" and
            (.conclusion == "success" or .conclusion == "failure" or .conclusion == "cancelled") and (
              (.path == ".github/workflows/promote-stage-to-prod.yml" and .event == "workflow_dispatch" and .head_branch == "main") or
              ((.path == ".github/workflows/dev-preview-deploy.yml" or
                .path == ".github/workflows/stage.yaml" or
                .path == ".github/workflows/prod.yaml") and .event == "pull_request")
            )' >/dev/null
          [[ $(api "$endpoint/actions/runs/$SOURCE_RUN_ID" --jq .run_attempt) == "$SOURCE_RUN_ATTEMPT" ]]
          head_sha=$(printf '%s' "$source_run" | jq -er .head_sha)
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          source_path=$(printf '%s' "$source_run" | jq -er .path)
          # Keep the old dispatcher valid while the new stage workflow is being rolled out.
          if [[ "$source_path" == .github/workflows/promote-stage-to-prod.yml ]]; then
            api "$endpoint/compare/$head_sha...main" --jq .status |
              { read -r status; [[ "$status" == ahead || "$status" == identical ]]; }
          fi
          # Require the upload to have completed even when the caller is reporting its own failure.
          api --paginate --slurp "$endpoint/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_RUN_ATTEMPT/jobs?per_page=100" |
            jq -e 'any(.[].jobs[]; any(.steps[]; .name == "Save feature notifications" and .conclusion == "success"))' >/dev/null
          # Bind one nonexpired, size-limited artifact to this exact run, attempt, and workflow revision.
          artifact=$(api --paginate --slurp "$endpoint/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" |
            jq -ce --arg name "feature-notifications-$SOURCE_RUN_ATTEMPT" --argjson run "$SOURCE_RUN_ID" --arg sha "$head_sha" '
              [.[].artifacts[] | select(.name == $name)] |
              if length == 1 then .[0] else error("Expected exactly one notification artifact") end |
              select(.expired == false and .workflow_run.id == $run and .workflow_run.head_sha == $sha and
                (.id|type == "number" and . > 0) and .size_in_bytes > 0 and .size_in_bytes <= 1048576)')
          artifact_id=$(printf '%s' "$artifact" | jq -er .id)
          api "$endpoint/actions/artifacts/$artifact_id/zip" > "$work/messages.zip"
          # Read only the expected JSON member. Never extract paths or execute artifact-supplied content.
          unzip -p "$work/messages.zip" feature-notifications.json > "$work/messages.json"
          # Validate the delivery envelope before making any writes: repository/run identity, issue numbers,
          # unique delivery keys, bounded message sizes, valid recipient logins, and safe hidden metadata.
          # Release outcomes and wording are deliberately not interpreted here; Compose owns that policy.
          jq -e --arg repo "$repo" --arg run "$SOURCE_RUN_ID" --arg attempt "$SOURCE_RUN_ATTEMPT" '
            .version == 1 and .repository == $repo and .source_run_id == $run and .source_run_attempt == $attempt and
            (.notifications | type == "array" and length > 0 and length <= 50 and
              (unique_by([.issue_number,.marker]) | length) == length and all(.[];
                (.issue_number | type == "string" and test("^[1-9][0-9]*$")) and
                (.marker | type == "string" and test("^<!-- [A-Za-z0-9][A-Za-z0-9 _:=.-]{0,500} -->$")) and
                (.github_text | type == "string" and length > 0 and length <= 60000 and (contains("<!--") | not)) and
                (.slack_text | type == "string" and length > 0 and length <= 2500) and
                (.slack_users | type == "array" and length > 0 and length <= 25 and all(.[];
                  type == "string" and test("^[A-Za-z0-9][A-Za-z0-9-]{0,38}$"))) and
                (.metadata | type == "object" and (tojson | length <= 5000 and (contains("-->") | not)))))' \
            "$work/messages.json" >/dev/null
          # Stage previews run before merge, so only post-merge stage/prod notifications
          # can be bound to a merge commit in the target branch.
          if [[ "$source_path" != .github/workflows/promote-stage-to-prod.yml &&
                "$source_path" != .github/workflows/dev-preview-deploy.yml ]]; then
            if [[ "$source_path" == .github/workflows/prod.yaml ]]; then
              target=prod
              pr=$(jq -er '.production_pr | select(type == "string" and test("^[1-9][0-9]*$"))' "$work/messages.json")
              merge_sha=$(jq -er '.production_sha' "$work/messages.json")
              jq -e --arg run "$SOURCE_RUN_ID" --arg attempt "$SOURCE_RUN_ATTEMPT" '
                .production_run_id == $run and .production_run_attempt == $attempt' "$work/messages.json" >/dev/null
            else
              target=stage
              pr=$(jq -er '.source_pr | select(type == "string" and test("^[1-9][0-9]*$"))' "$work/messages.json")
              merge_sha=$(jq -er '.stage_sha' "$work/messages.json")
              jq -e --arg run "$SOURCE_RUN_ID" --arg attempt "$SOURCE_RUN_ATTEMPT" '
                .stage_run_id == $run and .stage_run_attempt == $attempt' "$work/messages.json" >/dev/null
            fi
            [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]
            # PR runs identify their source branch, not the merge commit. Bind both to a
            # same-repository merged PR and prove its merge remains in the target history.
            api "$endpoint/pulls/$pr" | jq -e --arg repo "$repo" --arg target "$target" \
              --arg merge "$merge_sha" --argjson run "$source_run" '
                .merged == true and .base.ref == $target and .base.repo.full_name == $repo and
                .head.repo.full_name == $repo and .head.sha == $run.head_sha and .head.ref == $run.head_branch and
                .merge_commit_sha == $merge and
                (($run.created_at | fromdateiso8601) >= (.merged_at | fromdateiso8601))' >/dev/null
            api "$endpoint/compare/$merge_sha...$target" --jq .status |
              { read -r status; [[ "$status" == ahead || "$status" == identical ]]; }
          fi
          # Recheck freshness after downloading and validating the artifact, immediately before writes.
          [[ $(api "$endpoint/actions/runs/$SOURCE_RUN_ID" --jq .run_attempt) == "$SOURCE_RUN_ATTEMPT" ]]
          # Only verified caller-supplied messages reach GitHub and Slack. Delivery markers handle retries.
          deliver
          echo 'Supplied notifications delivered or already confirmed.'
