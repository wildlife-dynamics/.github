# Runs in .github; the personal PAT is used only for project reads.
name: Notify feature owners that Feature is ready to ship
run-name: Feature shipment notification for ${{ inputs.repository }}#${{ inputs.issue_number }}

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Source organization repository
        required: true
        type: string
      issue_number:
        description: Completed Feature issue
        required: true
        type: string
      project_number:
        description: Organization project whose Status must be Done
        type: string
        default: "2"
      fail_if_ineligible:
        description: Fail when the selected issue is ineligible
        type: boolean
        default: true
  workflow_call:
    inputs:
      repository:
        type: string
        required: true
      issue_number:
        type: string
        required: true
      project_number:
        type: string
        default: "2"
      fail_if_ineligible:
        type: boolean
        default: true
    secrets:
      ECOSCOPE_ELEBOT_PAT:
        required: true
      RAY_TEMPORARY_PAT_TOKEN_WHILE_ELEBOT_GETS_PROJECT_READ_ACCESS:
        required: true
      FEATURE_READY_SLACK_BOT_TOKEN:
        required: true

permissions: {}

concurrency:
  group: central-feature-ready-${{ inputs.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: false
  queue: max

jobs:
  notify-feature-ready-to-ship:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.ECOSCOPE_ELEBOT_PAT }}
      PROJECT_READ_TOKEN: ${{ secrets.RAY_TEMPORARY_PAT_TOKEN_WHILE_ELEBOT_GETS_PROJECT_READ_ACCESS }}
      SLACK_BOT_TOKEN: ${{ secrets.FEATURE_READY_SLACK_BOT_TOKEN }}
      SOURCE_REPOSITORY: ${{ inputs.repository }}
      FEATURE_ISSUE_NUMBER: ${{ inputs.issue_number }}
      PROJECT_NUMBER: ${{ inputs.project_number }}
      FAIL_IF_INELIGIBLE: ${{ inputs.fail_if_ineligible }}
      SLACK_CHANNEL: ${{ vars.FEATURE_READY_SLACK_CHANNEL_ID }}
      SLACK_MEMBERS: ${{ vars.GH_USERNAME_TO_SLACK_MEMBER_ID }}
    steps:
      - name: Check feature and notify its owners
        shell: bash
        run: |
          set -euo pipefail
          api() { gh api -H 'X-GitHub-Api-Version: 2026-03-10' "$@"; }
          eligible() {
            jq -e '
              (.type | if type == "object" then .name else . end) == "Feature" and
              .pull_request == null and .state == "closed" and
              .state_reason == "completed" and (.assignees | length > 0)
            ' >/dev/null
          }
          validate_members() {
            jq -ce 'if type != "object" then error("Expected a member map") else
              with_entries(.key |= ascii_downcase) |
              if all(.[]; type == "string" and test("^[UW][A-Z0-9]+$"))
              then . else error("Invalid Slack member ID") end end'
          }
          reject_ineligible() {
            echo "$1"
            if [[ "$FAIL_IF_INELIGIBLE" == true ]]; then exit 1; fi
            exit 0
          }

          [[ "$GITHUB_REPOSITORY" == wildlife-dynamics/.github ]]
          [[ "$SOURCE_REPOSITORY" =~ ^wildlife-dynamics/[A-Za-z0-9_.-]+$ ]]
          [[ "$FEATURE_ISSUE_NUMBER" =~ ^[1-9][0-9]*$ && "$PROJECT_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ -n "$GH_TOKEN" && -n "$PROJECT_READ_TOKEN" ]]
          [[ $(api user --jq '.login | ascii_downcase') == ecoscope-elebot ]]
          issue_path="repos/$SOURCE_REPOSITORY/issues/$FEATURE_ISSUE_NUMBER"
          issue=$(api "$issue_path")
          if ! printf '%s' "$issue" | eligible; then
            reject_ineligible 'Ignoring issue: not a completed Feature with an owner.'
          fi

          # Only this organization's configured project can make the feature eligible.
          query=$(cat <<'GRAPHQL'
          query($owner: String!, $repo: String!, $issue: Int!, $project: Int!, $cursor: String) {
            organization(login: $owner) { projectV2(number: $project) { id } }
            repository(owner: $owner, name: $repo) {
              issue(number: $issue) {
                projectItems(first: 100, after: $cursor, includeArchived: false) {
                  nodes {
                    project { id }
                    fieldValueByName(name: "Status") {
                      ... on ProjectV2ItemFieldSingleSelectValue { name }
                    }
                  }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }
          }
          GRAPHQL
          )
          cursor=null
          done_in_project=false
          while :; do
            page=$(GH_TOKEN="$PROJECT_READ_TOKEN" api graphql -f query="$query" \
              -f owner=wildlife-dynamics -f repo="${SOURCE_REPOSITORY#*/}" \
              -F issue="$FEATURE_ISSUE_NUMBER" -F project="$PROJECT_NUMBER" -F cursor="$cursor")
            project_id=$(printf '%s' "$page" | jq -er '.data.organization.projectV2.id')
            item=$(printf '%s' "$page" | jq -c --arg id "$project_id" \
              '.data.repository.issue.projectItems.nodes[] | select(.project.id == $id)')
            if [[ -n "$item" ]]; then
              done_in_project=$(printf '%s' "$item" | jq -r '.fieldValueByName.name == "Done"')
              break
            fi
            [[ $(printf '%s' "$page" | jq -r '.data.repository.issue.projectItems.pageInfo.hasNextPage') == true ]] || break
            cursor=$(printf '%s' "$page" | jq -er '.data.repository.issue.projectItems.pageInfo.endCursor')
          done
          [[ "$done_in_project" == true ]] || reject_ineligible 'Feature is not Done in the configured project.'

          # Recheck after the project request: ownership/closure can change independently.
          issue=$(api "$issue_path")
          printf '%s' "$issue" | eligible || reject_ineligible 'Feature eligibility changed.'
          comments=$(api --paginate --slurp "$issue_path/comments?per_page=100" | jq 'add')
          marker='<!-- feature-ready-to-ship-to-production -->'
          sent='<!-- feature-ready-slack-sent -->'
          pending='<!-- feature-ready-slack-pending -->'
          comment=$(printf '%s' "$comments" | jq -c --arg marker "$marker" '
            [.[] | select((.user.login == "ecoscope-elebot" or .user.login == "github-actions[bot]") and
            (.body | startswith($marker)))] | if length > 1 then error("Duplicate feature comments") else .[0] end')
          if [[ "$comment" == null ]]; then
            payload=$(printf '%s' "$issue" | jq --arg marker "$marker" '{body:
              ($marker + "\n**Feature: " + .title + "**\n\n" +
              ([.assignees[].login | "@" + .] | join(" ")) +
              " This feature is officially `Done`! 🎉 A feature shipped is a feature earned. Please land it on production ASAP. 🚀")
            }')
            comment=$(printf '%s' "$payload" | api --method POST "$issue_path/comments" --input -)
          fi
          if printf '%s' "$comment" | jq -e --arg sent "$sent" '
            (.body | contains($sent)) or (.body | contains("<!-- feature-ready-slack-dispatched -->"))
          ' >/dev/null; then
            echo 'Feature reminder already delivered or dispatched; preserving its metadata.'
            exit 0
          fi
          if printf '%s' "$comment" | jq -e --arg pending "$pending" '.body | contains($pending)' >/dev/null; then
            echo '::error::A previous Slack delivery is ambiguous. Verify it manually before clearing the pending marker.'
            exit 1
          fi

          [[ "$SLACK_CHANNEL" =~ ^[CG][A-Z0-9]+$ && -n "$SLACK_BOT_TOKEN" ]]
          members=$(printf '%s' "$SLACK_MEMBERS" | validate_members)
          mentions=$(printf '%s' "$issue" | jq -er --argjson members "$members" '
            [.assignees[].login | ascii_downcase | . as $login |
              $members[$login] // error("Missing Slack mapping for " + $login) | "<@" + . + ">"] | join(" ")')
          message=$(printf '%s' "$issue" | jq -r --arg mentions "$mentions" '
            "*Feature: " + (.title | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;")) +
            "*\n\n" + $mentions + " This feature is officially `Done`! 🎉 A feature shipped is a feature earned. Please land it on production ASAP. 🚀"')
          comment_id=$(printf '%s' "$comment" | jq -er '.id')
          comment_url=$(printf '%s' "$comment" | jq -er '.html_url')
          comment_path="repos/$SOURCE_REPOSITORY/issues/comments/$comment_id"
          body=$(printf '%s' "$comment" | jq --arg pending "$pending" '{body: (.body + "\n" + $pending)}')
          printf '%s' "$body" | api --method PATCH "$comment_path" --input - --silent

          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          payload=$(jq -n --arg text "$message" --arg url "$comment_url" --arg channel "$SLACK_CHANNEL" '
            {channel: $channel, text: ($text + "\n" + $url), unfurl_links: false, unfurl_media: false,
             blocks: [{type:"section",text:{type:"mrkdwn",text:$text,verbatim:true}},
                      {type:"context",elements:[{type:"mrkdwn",text:("<"+$url+"|View GitHub comment>")}]}] }')
          if ! status=$(curl --silent --show-error --max-time 30 --output "$response" --write-out '%{http_code}' \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H 'Content-Type: application/json' \
            --data-binary "$payload" https://slack.com/api/chat.postMessage); then
            echo '::error::Slack delivery is ambiguous; manually verify before retrying.'
            exit 1
          fi
          if [[ "$status" != 200 ]] || ! jq -e '.ok == true' "$response" >/dev/null; then
            # Definite rejections may be retried. Server errors/invalid responses remain pending.
            if [[ "$status" =~ ^4[0-9][0-9]$ ]] || { [[ "$status" == 200 ]] && jq -e '.ok == false' "$response" >/dev/null; }; then
              current=$(api "$comment_path")
              printf '%s' "$current" | jq --arg pending "$pending" '{body:(.body | split("\n"+$pending) | join(""))}' |
                api --method PATCH "$comment_path" --input - --silent
            fi
            echo '::error::Slack rejected the request or returned an invalid response. Check delivery state before retrying.'
            exit 1
          fi
          metadata=$(jq -ce --arg channel "$SLACK_CHANNEL" '
            if .channel == $channel and (.ts | type == "string" and test("^[0-9]+\\.[0-9]+$"))
            then {channel_id:.channel,thread_ts:.ts} else error("Invalid Slack message identity") end' "$response")
          block=$(printf '<!-- feature-slack-thread:v1\n%s\n-->' "$(printf '%s' "$metadata" | jq .)")
          current=$(api "$comment_path")
          printf '%s' "$current" | jq --arg pending "$pending" --arg sent "$sent" --arg block "$block" '
            {body: ((.body | split("\n"+$pending) | join("")) + "\n" + $sent + "\n\n" + $block)}' |
            api --method PATCH "$comment_path" --input - --silent
          echo 'Feature owners notified; original Slack channel/thread saved in the hidden comment.'
