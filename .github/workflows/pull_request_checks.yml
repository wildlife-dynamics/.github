name: Pull request checks
run-name: >-
  ${{ inputs.notify_feature && format('Feature shipment notification for {0}#{1}', inputs.repository, inputs.issue_number) || '' }}

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      notify_feature:
        description: Run the complete feature notification flow in .github
        required: false
        type: boolean
        default: false
      repository:
        description: Source repository, for example wildlife-dynamics/compose
        required: false
        type: string
        default: ""
      issue_number:
        description: Feature issue number in the source repository
        required: false
        type: string
        default: ""
      project_number:
        description: Organization project whose Status must be Done
        required: false
        type: string
        default: "2"
      fail_if_ineligible:
        description: Fail the manual test if the selected issue is not eligible
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: >-
    pull-request-checks-${{ github.workflow }}-${{ inputs.notify_feature && format('{0}-{1}', inputs.repository, inputs.issue_number) || github.ref }}
  cancel-in-progress: ${{ !inputs.notify_feature }}

jobs:
  notify-feature:
    if: github.event_name == 'workflow_dispatch' && inputs.notify_feature
    permissions: {}
    uses: ./.github/workflows/notify-feature-ready-to-ship-to-production.yml
    with:
      repository: ${{ inputs.repository }}
      issue_number: ${{ inputs.issue_number }}
      project_number: ${{ inputs.project_number }}
      fail_if_ineligible: ${{ inputs.fail_if_ineligible }}
    secrets:
      ECOSCOPE_ELEBOT_PAT: ${{ secrets.ECOSCOPE_ELEBOT_PAT }}
      FEATURE_READY_SLACK_BOT_TOKEN: ${{ secrets.FEATURE_READY_SLACK_BOT_TOKEN }}

  actionlint:
    name: Validate workflows with actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          # actionlint 1.7.12 predates GitHub's supported concurrency.queue property.
          args: -color -ignore=unexpected\x20key\x20\x22queue\x22\x20for\x20\x22concurrency\x22\x20section\.

  issue-forms:
    name: Validate issue forms with check-jsonschema
    runs-on: ubuntu-latest
    env:
      ISSUE_FORMS_SCHEMA: https://json.schemastore.org/github-issue-forms.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install check-jsonschema
        run: python -m pip install "check-jsonschema==0.37.2"

      - name: Validate issue forms
        run: >-
          check-jsonschema
          --schemafile "$ISSUE_FORMS_SCHEMA"
          .github/ISSUE_TEMPLATE/Bug.yml
          .github/ISSUE_TEMPLATE/Feature.yml

  zizmor:
    name: Audit workflows with zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.6.2
        with:
          advanced-security: false
          annotations: true
          config: .github/zizmor.yml
          version: v1.28.0
