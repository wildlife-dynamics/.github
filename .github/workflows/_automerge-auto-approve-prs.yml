# Enables squash auto-merge for non-draft pull requests labeled `automerge`.
# Matching pull requests authored by `ecoscope-elebot` are also auto-approved.
#
# Inputs:
#   `pull_request_is_draft` (required, boolean): Whether the pull request is a draft.
#   `pull_request_author_github_username` (required, string): Pull request author.
#   `pull_request_label_names_serialized_list` (required, string): JSON label names.
#
# Secrets:
#   `PAT` (required): Bot token with permission to merge in the calling repository.
#
# Example caller:
#
# name: Automerge and auto-approve PRs
#
# on:
#   pull_request:
#     types: [opened, reopened, ready_for_review, labeled]
#
# permissions: {}
#
# jobs:
#   automerge:
#     permissions:
#       pull-requests: write
#     uses: wildlife-dynamics/.github/.github/workflows/_automerge-auto-approve-prs.yml@main
#     secrets:
#       PAT: ${{ secrets.ECOSCOPE_ELEBOT_PAT }}
#     with:
#       pull_request_is_draft: ${{ github.event.pull_request.draft }}
#       pull_request_author_github_username: ${{ github.event.pull_request.user.login }}
#       pull_request_label_names_serialized_list: ${{ toJSON(github.event.pull_request.labels.*.name) }}

name: Reusable automerge and auto-approve PRs

on:
  workflow_call:
    inputs:
      pull_request_is_draft:
        type: boolean
        required: true
      pull_request_author_github_username:
        type: string
        required: true
      pull_request_label_names_serialized_list:
        type: string
        required: true
    secrets:
      PAT:
        required: true

permissions: {}

jobs:
  auto-merge-elebot-updates-or-prs-with-automerge-label:
    name: Enable Github's auto-merge for non-draft PRs with the label `automerge`
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    if: inputs.pull_request_is_draft == false && contains(fromJson(inputs.pull_request_label_names_serialized_list), 'automerge')
    steps:
      - id: enable-automerge
        uses: alexwilson/enable-github-automerge-action@1.0.0
        with:
          github-token: ${{ secrets.PAT }}
          merge-method: SQUASH

      - name: Inform user that automerge was enabled
        if: steps.enable-automerge.outcome == 'success'
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ℹ️ @${{ inputs.pull_request_author_github_username }} since you've added the `automerge` label, I have enabled automerge on this PR. Your PR will merge automatically once the required approvals and checks are satisfied.

  auto-approve-elebot-updates:
    name: Auto-approve elebot PRs
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    if: inputs.pull_request_is_draft == false && inputs.pull_request_author_github_username == 'ecoscope-elebot' && contains(fromJson(inputs.pull_request_label_names_serialized_list), 'automerge')
    steps:
      - id: auto-approve-ecoscope-elebot
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          review-message: "✅ Auto-approved ecoscope-elebot PR."
