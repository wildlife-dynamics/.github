default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        # Match the narrow compatibility exception used by workflow CI.
        args: ['-ignore', 'unexpected key "queue" for "concurrency" section\.']

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.2
    hooks:
      - id: check-jsonschema
        name: Validate GitHub issue forms
        args:
          - --schemafile
          - https://json.schemastore.org/github-issue-forms.json
        files: ^\.github/ISSUE_TEMPLATE/(?:Bug|Feature)\.yml$

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.28.0
    hooks:
      - id: zizmor
        args:
          - .
        files: ^\.github/(?:workflows/.*\.ya?ml|zizmor\.yml)$
        pass_filenames: false

  - repo: local
    hooks:
      - id: test-feature-delivery
        name: Test Feature and Bug notifications offline
        language: system
        entry: python3 -m unittest discover -s tests
        files: ^(?:tests/.*\.py|\.github/workflows/(?:_notify-feature-ready-to-ship-to-production|notify-feature-ready-to-ship-to-production|notify-feature-message)\.yml)$
        pass_filenames: false
